graph_route_planner_node:
  ros__parameters:
    # MAP
    # KML map to plan on. Leave empty to use the map bundled in this package's
    # assets/ directory. Polygons are classified by nesting depth: a lake is
    # water, an island in it is land, a lake on that island is water again.
    map_path: ""

    # BOAT
    # The closest the boat can sail to the wind, in degrees. Legs inside this
    # angle cannot be sailed directly and are tacked instead.
    # This matches route_planner's min_tack_angle so the two plan alike. Note
    # that route_planner silently adds 5 degrees to its own value when deciding
    # whether a leg is sailable; this planner uses the number as given, because
    # it has a real polar diagram and does not need that safety fudge.
    min_tack_angle: 50

    # PLANNING CADENCE
    # How often the planner checks whether it should (re)plan, in seconds.
    # Planning is synchronous and takes ~0.1-0.6 s per leg, blocking this node.
    plan_interval: 2.0

    # REPLANNING
    # The radius around a via point within which it counts as rounded (in meters).
    # Keep this equal to route_follower's dist_threshold so both agree on progress.
    dist_threshold: 5

    # How far the boat may drift from the planned route before it is replanned
    # (in meters). A replan starts from the boat's current position and covers
    # only the via points still ahead.
    off_course_threshold: 10

    # The minimum time between two replans, in seconds, so a persistent trigger
    # cannot thrash the planner.
    min_time_between_replanning: 5.0

    # How far inside the no-go zone the bearing from the boat to the waypoint it
    # is steering at must fall before the route is replanned, in degrees.
    #
    # This is hysteresis, not a safety margin, and it is not optional. The polar
    # steps from 0 to 5 knots at min_tack_angle, so upwind VMG peaks exactly
    # there and the planner lays every tack at precisely that angle — right on
    # the trigger. At 0 the boat therefore replans on a fraction of a degree of
    # leeway or steering wobble, several times a minute while beating, and each
    # replan restarts the follower's maneuver. 5 degrees keeps the genuine
    # "cannot lay the mark" cases and drops the noise.
    no_go_replan_margin: 5.0

    # How far inside the shore margin the boat may get before it is replanned
    # out of it (in meters). Must be below `margin`.
    #
    # Routes run right along the margin's edge, so leeway on a close-hauled leg
    # carries the boat into the margin long before off_course_threshold notices
    # — and with a 2.5 m hull the boat can touch land when only ~0.75 m into a
    # 2 m margin. This is hysteresis: at 0 every brush with the edge replans,
    # and each replan restarts the follower's maneuver.
    # Independently, a grounding reported on /sense/collision always replans.
    margin_replan_depth: 0.5

    # SEARCH
    # Clearance kept from the shoreline and from every island (in meters).
    margin: 3.0

    # Spacing of the open-water waypoint grid used for tacking (in meters).
    # Smaller is more accurate and much slower: cost grows with the square.
    grid_spacing: 6.0

    # Nodes closer together than this are merged into one (in meters). 0 disables.
    merge_threshold: 1.5

    # Shortest leg the planner will consider (in meters). 0 disables.
    # Raising it suppresses fiddly hops, but it filters edges, so a high value
    # can disconnect the graph and leave no route at all.
    min_leg_distance: 0.0

    # A fixed time charge added to every leg of the route, biasing the search
    # toward fewer, longer legs.
    #
    # Sailing time alone prices an 8 m repositioning hop at 8 m of sailing and
    # nothing else, so the planner will take one to gain a fraction of a percent
    # — arriving at a mark via a stub and a sharp turn. Every leg boundary is a
    # turn, and a turn is where the boat stops making progress while it settles.
    # This is that missing cost.
    #
    # It shapes the search only and never appears in the reported duration, and
    # it cannot make an unsailable heading sailable — a beat still tacks however
    # high it is set. On the standard course the route reaches its minimum leg
    # count at 0.5 and does not change again up to 16, so the exact value is not
    # delicate; 1.0 sits well inside that plateau. 0 restores pure time-optimal
    # routing.
    segment_cost: 1.0

    # Extra weight on time spent inside the shore margin, for a boat that has
    # drifted there (or starts there).
    #
    # Such a boat cannot be routed through the margin-eroded water at all, so its
    # first leg is planned through the real water instead, and each second of it
    # spent inside the margin costs 1 + shore_penalty seconds. At a large value
    # the planner first gets the boat off the shore as quickly as it can on a
    # sailable heading — on a lee shore that is a close reach, not straight away
    # from land — and only then heads for the via point. 0 makes the strip legal
    # but free, so the route may run along the shore inside the margin.
    # Like segment_cost it shapes the search only and is not in the duration.
    shore_penalty: 20.0

    # For a boat inside the shore margin, the largest turn onto the first leg
    # out of it (in degrees). That leg must also stay on the boat's current tack.
    #
    # A boat that close to shore may have no speed — it may be pinned against
    # the land. Then it cannot tack (no momentum to carry the bow through the
    # wind), and bearing away far swings the bow into a lee shore. So the way
    # out is planned roughly straight ahead. If no such leg leads anywhere, any
    # sailable leg is allowed instead.
    escape_max_turn: 45.0

    # Longest leg the planner will consider (in meters).
    # 0 derives it from the map, which is the only value that never truncates a
    # leg the boat could actually sail. A fixed limit below the map's longest
    # crossing silently forces detours through waypoints that are not needed.
    max_leg_distance: 0.0

    # If inputs (mission, position, wind) are missing, the node warns. This is the
    # minimum time between two such warnings in seconds, to avoid flooding the log.
    time_between_missing_values_logs: 10.0
