description: >
  The Landgraben pond, at twice its real size (about 168 x 188 m), with a
  large island in the middle and a fountain to the south-west. A
  counter-clockwise lap of the island. With the wind from the south, the
  narrow (~16 m) east channel is a downwind run; the only upwind leg is south
  through the wide west channel, where there is room to tack. Buoys form a
  small course area in the open southern basin (with a yellow gate) plus one
  blue mark in the north-west.
