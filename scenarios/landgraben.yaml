description: >
  The Landgraben pond, at twice its real size (about 168 x 188 m), with a
  large island in the middle and a fountain to the south-west. A counter-clockwise lap of the island. With
  the wind from the south, the narrow (~16 m) east channel is a downwind run;
  the only upwind leg is south through the wide west channel, where there is
  room to tack. Buoys form a small course area in the open southern basin
  (with a yellow gate) plus one blue mark in the north-west.
map: landgraben
boat: {east: 0, north: -76}
wind: {direction: 180, speed: 4}
buoys:
  - {east: -20, north: -60, color: orange}
  - {east: 44, north: -44, color: red}
  - {east: -60, north: -24, color: green}
  - {east: -8, north: -36, color: yellow}   # gate
  - {east: 12, north: -36, color: yellow}   # gate
  - {east: -50, north: 60, color: blue}
waypoints:
  - [54, -24]     # into the east channel
  - [54, 16]      # up the east channel
  - [10, 76]       # across the north
  - [-64, 20]     # down the west channel
  - [0, -70]      # back to the start
planner:
  grid_spacing: 12
video:
  speedup: 4
  fps: 30
